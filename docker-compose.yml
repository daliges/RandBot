services:
  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data

  bot:
    build: .
    env_file: .env
    depends_on:
      - redis
    ports:
      - "127.0.0.1:8484:8484"
    volumes:
      - ./channels.db:/app/channels.db
      - ./randbot.dev.session:/app/randbot.dev.session

volumes:
  redis-data:
