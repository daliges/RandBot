name: CI/CD

on:
  push:
    branches: [main]

concurrency:
  group: ci-cd-main
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ secrets.PYTHON_VERSION || '3.11' }}
      - run: pip install -r requirements.txt
      - run: pytest

  smoke:
    needs: test
    runs-on: ubuntu-latest
    env:
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}               # ideally a staging bot token
      TELETHON_API_ID: ${{ secrets.TELETHON_API_ID }}   # optional; omit to skip Telethon startup
      TELETHON_API_HASH: ${{ secrets.TELETHON_API_HASH }}
      TELETHON_SESSION_NAME: ${{ secrets.TELETHON_SESSION_NAME || 'ci-session' }}
      CHANNELS_DB_PATH: /app/channels.db
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CHANNEL_IDS_CACHE_KEY: channel_ids_cache
      CHANNEL_IDS_TTL: 300
    steps:
      - uses: actions/checkout@v4

      - name: Prep bind-mounted files
        run: |
          touch channels.db randbot.dev.session

      - name: Create .env for compose
        run: |
          cat > .env <<'EOF'
          BOT_TOKEN=${BOT_TOKEN}
          TELETHON_API_ID=${TELETHON_API_ID}
          TELETHON_API_HASH=${TELETHON_API_HASH}
          TELETHON_SESSION_NAME=${TELETHON_SESSION_NAME}
          CHANNELS_DB_PATH=${CHANNELS_DB_PATH}
          REDIS_HOST=${REDIS_HOST}
          REDIS_PORT=${REDIS_PORT}
          CHANNEL_IDS_CACHE_KEY=${CHANNEL_IDS_CACHE_KEY}
          CHANNEL_IDS_TTL=${CHANNEL_IDS_TTL}
          EOF

      - name: Build and start stack
        run: docker compose up --build -d

      - name: Wait for bot to stay up
        run: |
          attempts=0
          until [ $attempts -ge 6 ]; do
            if ! docker compose ps bot | grep -q "Up"; then
              echo "Bot container not running"
              docker compose logs bot
              exit 1
            fi
            sleep 10
            attempts=$((attempts+1))
          done
          docker compose logs --tail=80 bot

      - name: Teardown
        if: always()
        run: docker compose down -v

  deploy:
    needs: smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY }}
      - run: ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts
      - name: Remote deploy
        run: ssh ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} "bash ${{ secrets.EC2_PATH || '/home/ec2-user/app' }}/deploy.sh"
      - name: Health check
        run: curl -f "$HEALTHCHECK_URL"
        env:
          HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
